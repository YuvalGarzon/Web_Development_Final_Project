services:
  mongo:
    image: mongo:7
    container_name: web-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
    container_name: web-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/afeka_trip_auth
  frontend:
    build:
      context: ./frontend
    container_name: web-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - INTERNAL_API_URL=http://backend:4000

volumes:
  mongo_data: